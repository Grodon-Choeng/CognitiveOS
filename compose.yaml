services:
  postgres:
    image: postgres:16-alpine
    container_name: cognitiveos-postgres
    environment:
      POSTGRES_DB: cognitiveos
      POSTGRES_USER: cognitiveos
      POSTGRES_PASSWORD: cognitiveos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognitiveos -d cognitiveos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cognitiveos-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  temporal:
    image: temporalio/auto-setup:1.28.0
    container_name: cognitiveos-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: cognitiveos
      POSTGRES_PWD: cognitiveos
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.38.0
    container_name: cognitiveos-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  app-migrate:
    image: ${COGNITIVEOS_APP_IMAGE:-cognitiveos-app:latest}
    container_name: cognitiveos-app-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      COGNITIVE_OS_DATABASE_URL: postgresql+asyncpg://cognitiveos:cognitiveos@postgres:5432/cognitiveos
      COGNITIVE_OS_REDIS_URL: redis://redis:6379/0
      COGNITIVE_OS_TEMPORAL_HOST: temporal:7233
      COGNITIVE_OS_PROCESS_ROLE: migrate
    volumes:
      - ./logs:/app/logs
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  app-api:
    image: ${COGNITIVEOS_APP_IMAGE:-cognitiveos-app:latest}
    container_name: cognitiveos-app-api
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      COGNITIVE_OS_DATABASE_URL: postgresql+asyncpg://cognitiveos:cognitiveos@postgres:5432/cognitiveos
      COGNITIVE_OS_REDIS_URL: redis://redis:6379/0
      COGNITIVE_OS_TEMPORAL_HOST: temporal:7233
      COGNITIVE_OS_PROCESS_ROLE: api
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  app-worker:
    image: ${COGNITIVEOS_APP_IMAGE:-cognitiveos-app:latest}
    container_name: cognitiveos-app-worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      COGNITIVE_OS_DATABASE_URL: postgresql+asyncpg://cognitiveos:cognitiveos@postgres:5432/cognitiveos
      COGNITIVE_OS_REDIS_URL: redis://redis:6379/0
      COGNITIVE_OS_TEMPORAL_HOST: temporal:7233
      COGNITIVE_OS_PROCESS_ROLE: worker
    volumes:
      - ./logs:/app/logs
    command: ["uv", "run", "python", "-m", "app.bootstrap.temporal"]
    restart: unless-stopped

  app-feishu-longconn:
    image: ${COGNITIVEOS_APP_IMAGE:-cognitiveos-app:latest}
    container_name: cognitiveos-app-feishu-longconn
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      COGNITIVE_OS_DATABASE_URL: postgresql+asyncpg://cognitiveos:cognitiveos@postgres:5432/cognitiveos
      COGNITIVE_OS_REDIS_URL: redis://redis:6379/0
      COGNITIVE_OS_TEMPORAL_HOST: temporal:7233
      COGNITIVE_OS_PROCESS_ROLE: feishu-longconn
    volumes:
      - ./logs:/app/logs
    command: ["uv", "run", "python", "-m", "app.bootstrap.feishu_long_connection"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
