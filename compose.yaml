services:
  postgres:
    image: postgres:16-alpine
    container_name: cognitiveos-postgres
    environment:
      POSTGRES_DB: cognitiveos
      POSTGRES_USER: cognitiveos
      POSTGRES_PASSWORD: cognitiveos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognitiveos -d cognitiveos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
